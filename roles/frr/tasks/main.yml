---
- name: Configurer FRR
  block:
    - name: Installer FRR
      ansible.builtin.apt:
        name: frr
        state: present
        update_cache: true
    - name: Déployer les daemons FRR
      ansible.builtin.template:
        src: daemons.j2
        dest: /etc/frr/daemons
        owner: frr
        group: frr
        mode: "0640"
      notify: Redémarrer frr
    - name: Déployer la configuration FRR
      ansible.builtin.template:
        src: frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: "0640"
      notify: Redémarrer frr

- name: S'assurer que frr est démarré et activé
  ansible.builtin.systemd:
    name: frr
    state: started
    enabled: true
  when: frr_enabled
