---
- name: Configurer keepalived
  when:
    - keepalived_enabled
  block:
    - name: Installer keepalived
      ansible.builtin.apt:
        name: keepalived
        state: present
        update_cache: true

    - name: Déployer le script keepalived MASTER
      ansible.builtin.template:
        src: notify-master.sh.j2
        dest: /usr/local/sbin/keepalived-master
        owner: root
        group: root
        mode: "0750"

    - name: Déployer le script keepalived BACKUP
      ansible.builtin.template:
        src: notify-backup.sh.j2
        dest: /usr/local/sbin/keepalived-backup
        owner: root
        group: root
        mode: "0750"

    - name: Déployer keepalived
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0600"
        validate: keepalived --config-test --use-file %s
      notify: Redémarrer keepalived

- name: S'assurer que keepalived est démarré et activé
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
  when:
    - keepalived_enabled
