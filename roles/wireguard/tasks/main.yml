---
- name: Configure WireGuard
  when: wireguard_enabled
  block:
    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
    - name: Create WireGuard directory
      ansible.builtin.file:
        path: "{{ wireguard_key_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate HA key on primary firewall
      ansible.builtin.shell:
        cmd: >-
          wg genkey > {{ wireguard_key_directory }}/{{ item.name }}.key
        creates: "{{ wireguard_key_directory }}/{{ item.name }}.key"
      loop: "{{ wireguard_interfaces }}"
      when:
        - wireguard_key_mode == "shared"
        - wireguard_shared_private_key | length == 0
        - inventory_hostname == ansible_play_hosts_all[0]
      no_log: true

    - name: Read HA key from primary firewall
      ansible.builtin.slurp:
        src: "{{ wireguard_key_directory }}/{{ item.name }}.key"
      loop: "{{ wireguard_interfaces }}"
      when:
        - wireguard_key_mode == "shared"
        - wireguard_shared_private_key | length == 0
      delegate_to: "{{ ansible_play_hosts_all[0] }}"
      run_once: true
      register: wireguard_primary_key
      no_log: true

    - name: Assert WireGuard key configuration
      ansible.builtin.assert:
        that:
          - wireguard_key_mode in ["standalone", "shared"]

    - name: Deploy provided WireGuard HA key
      ansible.builtin.copy:
        content: "{{ wireguard_shared_private_key }}\n"
        dest: "{{ wireguard_key_directory }}/{{ item.name }}.key"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ wireguard_interfaces }}"
      when:
        - wireguard_key_mode == "shared"
        - wireguard_shared_private_key | length > 0
      no_log: true

    - name: Deploy generated WireGuard HA key
      ansible.builtin.copy:
        content: >-
          {{ wireguard_primary_key.results[index].content | b64decode }}
        dest: "{{ wireguard_key_directory }}/{{ item.name }}.key"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ wireguard_interfaces }}"
      loop_control:
        index_var: index
      when:
        - wireguard_key_mode == "shared"
        - wireguard_shared_private_key | length == 0
      no_log: true

    - name: Check WireGuard private keys
      ansible.builtin.stat:
        path: "{{ wireguard_key_directory }}/{{ item.name }}.key"
      loop: "{{ wireguard_interfaces }}"
      register: wireguard_key_stats

    - name: Generate WireGuard private keys
      ansible.builtin.shell:
        cmd: >-
          wg genkey > {{ wireguard_key_directory }}/{{ item.name }}.key
        creates: "{{ wireguard_key_directory }}/{{ item.name }}.key"
      loop: "{{ wireguard_interfaces }}"
      no_log: true

    - name: Compute WireGuard public keys
      ansible.builtin.shell:
        cmd: >-
          wg pubkey < {{ wireguard_key_directory }}/{{ item.name }}.key
      loop: "{{ wireguard_interfaces }}"
      register: wireguard_public_keys
      changed_when: false
      no_log: true

    - name: Deploy WireGuard public keys
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ wireguard_key_directory }}/{{ item.item.name }}.pub"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ wireguard_public_keys.results }}"
      no_log: true

    - name: Read WireGuard private keys
      ansible.builtin.slurp:
        src: "{{ wireguard_key_directory }}/{{ item.name }}.key"
      loop: "{{ wireguard_interfaces }}"
      register: wireguard_key_contents
      no_log: true

    - name: Deploy WireGuard tunnel configurations
      ansible.builtin.template:
        src: wg.conf.j2
        dest: "{{ wireguard_key_directory }}/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ wireguard_interfaces }}"

- name: Enable and start WireGuard tunnels (standalone)
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.name }}"
    state: started
    enabled: true
  loop: "{{ wireguard_interfaces }}"
  when:
    - wireguard_enabled
    - not keepalived_enabled

- name: Check WAN VIP presence (HA)
  ansible.builtin.command:
    cmd: "ip -4 addr show dev {{ wireguard_vip_interface }}"
  register: wireguard_vip_state
  changed_when: false
  when:
    - wireguard_enabled

- name: Manage WireGuard tunnels based on firewall role (HA)
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.name }}"
    state: "{{ 'started' if wireguard_vip_address in wireguard_vip_state.stdout else 'stopped' }}"
    enabled: false
  loop: "{{ wireguard_interfaces }}"
  when:
    - wireguard_enabled
