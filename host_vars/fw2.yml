---
keepalived_node_id: fw2
keepalived_priority: 100
keepalived_ha_address: 10.20.10.4
keepalived_peer_ha_address: 10.20.10.3

strongswan_connections:
  peer:
    keyexchange: ikev2
    type: tunnel
    auto: add
    left: 10.10.10.4
    leftsubnet: 10.30.2.0/24
    right: 10.10.10.3
    rightsubnet: 10.30.1.0/24
    authby: psk
    psk: "test-psk-change-me"

network_interfaces:
  - name: eth0
    address: 10.10.10.4
    netmask: 255.255.255.0
    gateway: 10.10.10.1
  - name: eth1
    address: 10.20.10.4
    netmask: 255.255.255.0
network_routes: []

frr_daemons:
  - zebra
  - ospfd
frr_configs:
  ospf: |
    router ospf
      ospf router-id 10.10.10.4
      network 10.10.10.0/24 area 0
      passive-interface eth1
